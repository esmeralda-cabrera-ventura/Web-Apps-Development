<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="wt">
<title id="wt">A window being squeegeed clean, the wiped half clear and the rest still hazy</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0" stop-color="#BFE4F5"/><stop offset="0.42" stop-color="#8FCDEC"/>
    <stop offset="0.72" stop-color="#CFE6E4"/><stop offset="1" stop-color="#E4EEDF"/>
  </linearGradient>
  <linearGradient id="hedge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8FB37A"/><stop offset="1" stop-color="#5E8A55"/>
  </linearGradient>
  <linearGradient id="hedge2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A7C48C"/><stop offset="1" stop-color="#74A165"/>
  </linearGradient>
  <linearGradient id="glassRefl" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
    <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.05"/>
    <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.34"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="frameFace" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#F4F7F8"/>
    <stop offset="1" stop-color="#DCE5E9"/>
  </linearGradient>
  <linearGradient id="sillG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.4" stop-color="#EDF2F4"/>
    <stop offset="1" stop-color="#C6D3D9"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FDFEFE"/><stop offset="0.3" stop-color="#C4D0D6"/>
    <stop offset="0.55" stop-color="#F0F4F6"/><stop offset="1" stop-color="#93A3AC"/>
  </linearGradient>
  <linearGradient id="rubber" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3B4A52"/><stop offset="1" stop-color="#1E2A31"/>
  </linearGradient>
  <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2C7BE0"/><stop offset="0.4" stop-color="#0054B4"/>
    <stop offset="1" stop-color="#00397C"/>
  </linearGradient>
  <radialGradient id="drop" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
    <stop offset="0.6" stop-color="#D3EAF2" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#A9CBD8" stop-opacity="0.25"/>
  </radialGradient>
  <filter id="blurView" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3.2"/>
  </filter>
  <filter id="hazeF" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>
  <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="200%">
    <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0C2A38" flood-opacity="0.22"/>
  </filter>
  <clipPath id="glassAll"><rect x="58" y="52" width="444" height="450" rx="3"/></clipPath>
  <clipPath id="hazyPart"><path d="M58 502 H502 V214 L58 400 Z"/></clipPath>
</defs>

<rect width="560" height="620" fill="#E9F1F4"/>

<!-- reveal / wall shadow around the opening -->
<rect x="36" y="30" width="488" height="494" rx="6" fill="#D3DFE4"/>
<rect x="42" y="36" width="476" height="482" rx="4" fill="#E7EEF1"/>

<g clip-path="url(#glassAll)">
  <!-- the view outside -->
  <rect x="58" y="52" width="444" height="450" fill="url(#sky)"/>
  <g filter="url(#blurView)">
    <circle cx="150" cy="128" r="46" fill="#FFFFFF" opacity="0.75"/>
    <circle cx="196" cy="140" r="34" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="118" cy="146" r="28" fill="#FFFFFF" opacity="0.55"/>
    <path d="M58 372 q70 -34 140 -12 t150 -6 t154 22 V502 H58 Z" fill="url(#hedge)"/>
    <path d="M58 408 q90 -26 168 -4 t138 -10 t138 20 V502 H58 Z" fill="url(#hedge2)" opacity="0.85"/>
    <ellipse cx="404" cy="336" rx="62" ry="54" fill="#6E9C5F"/>
    <ellipse cx="440" cy="356" rx="44" ry="40" fill="#83AF6F"/>
    <rect x="398" y="380" width="12" height="42" fill="#7A6A52"/>
  </g>

  <!-- glass reflection across the whole pane -->
  <rect x="58" y="52" width="444" height="450" fill="url(#glassRefl)"/>
  <path d="M92 502 L300 52 h74 L166 502 Z" fill="#FFFFFF" opacity="0.16"/>
  <path d="M330 502 L508 52 h30 L360 502 Z" fill="#FFFFFF" opacity="0.10"/>

  <!-- the half that has NOT been cleaned yet -->
  <g clip-path="url(#hazyPart)">
    <rect x="58" y="52" width="444" height="450" fill="#9FB2B8" opacity="0.55"/>
    <rect x="58" y="52" width="444" height="450" filter="url(#hazeF)" opacity="0.3"/>
    <g fill="#7D9298" opacity="0.5">
      <circle cx="130" cy="470" r="3"/><circle cx="205" cy="440" r="2"/>
      <circle cx="268" cy="478" r="2.6"/><circle cx="330" cy="446" r="1.8"/>
      <circle cx="392" cy="480" r="3.2"/><circle cx="452" cy="452" r="2.2"/>
      <circle cx="168" cy="426" r="1.6"/><circle cx="420" cy="418" r="1.8"/>
    </g>
    <!-- water beading on the uncleaned glass -->
    <g>
      <ellipse cx="150" cy="452" rx="7" ry="9" fill="url(#drop)"/>
      <ellipse cx="240" cy="424" rx="5" ry="6.5" fill="url(#drop)"/>
      <ellipse cx="318" cy="466" rx="8" ry="10" fill="url(#drop)"/>
      <ellipse cx="408" cy="436" rx="5.5" ry="7" fill="url(#drop)"/>
      <ellipse cx="466" cy="474" rx="6" ry="8" fill="url(#drop)"/>
      <ellipse cx="196" cy="486" rx="4.5" ry="6" fill="url(#drop)"/>
    </g>
  </g>

  <!-- clean squeegee edge with the trailing water bead -->
  <path d="M502 214 L58 400" stroke="#FFFFFF" stroke-width="5" stroke-opacity="0.95" fill="none"/>
  <path d="M502 222 L58 408" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" fill="none"/>
  <path d="M502 208 L58 394" stroke="#DFF1F7" stroke-width="2.5" stroke-opacity="0.75" fill="none"/>
</g>

<!-- frame: outer casing with bevel -->
<path d="M50 44 H510 V510 H50 Z M58 52 H502 V502 H58 Z" fill="url(#frameFace)" fill-rule="evenodd"/>
<rect x="50" y="44" width="460" height="466" fill="none" stroke="#BCCBD2" stroke-width="1.5"/>
<rect x="58" y="52" width="444" height="450" rx="3" fill="none" stroke="#AEBFC7" stroke-width="2"/>
<path d="M58 52 H502" stroke="#FFFFFF" stroke-width="2.5" opacity="0.9"/>
<!-- inner shadow where glass meets frame -->
<rect x="58" y="52" width="444" height="16" fill="#0C2A38" opacity="0.09"/>
<rect x="58" y="52" width="14" height="450" fill="#0C2A38" opacity="0.06"/>

<!-- mullions with real thickness -->
<rect x="266" y="52" width="28" height="450" fill="url(#frameFace)"/>
<rect x="266" y="52" width="28" height="450" fill="none" stroke="#B6C6CD" stroke-width="1.5"/>
<path d="M270 52 V502" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>
<rect x="58" y="263" width="444" height="28" fill="url(#frameFace)"/>
<rect x="58" y="263" width="444" height="28" fill="none" stroke="#B6C6CD" stroke-width="1.5"/>
<path d="M58 267 H502" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>
<rect x="58" y="289" width="444" height="4" fill="#0C2A38" opacity="0.08"/>

<!-- sill -->
<rect x="36" y="510" width="488" height="26" rx="4" fill="url(#sillG)"/>
<rect x="36" y="510" width="488" height="5" fill="#FFFFFF"/>
<rect x="36" y="536" width="488" height="8" rx="3" fill="#0C2A38" opacity="0.13"/>

<!-- squeegee, angled along the wiped edge -->
<g transform="rotate(-22.7 280 307)" filter="url(#dropShadow)">
  <rect x="46" y="292" width="440" height="9" rx="4" fill="url(#rubber)"/>
  <rect x="46" y="276" width="440" height="18" rx="5" fill="url(#steel)"/>
  <rect x="46" y="279" width="440" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="252" y="236" width="24" height="44" rx="7" fill="url(#steel)"/>
  <rect x="222" y="188" width="86" height="52" rx="22" fill="url(#grip)"/>
  <rect x="232" y="198" width="66" height="13" rx="6.5" fill="#5B9BEC" opacity="0.55"/>
  <rect x="238" y="220" width="54" height="6" rx="3" fill="#00295E" opacity="0.35"/>
</g>
</svg>
